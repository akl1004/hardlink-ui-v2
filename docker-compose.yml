services:
  hardlink-ui:
    build: .
    container_name: hardlink-ui-v2
    ports:
      - "${APP_PORT:-18120}:${APP_PORT:-18120}"
    volumes:
      - ./data:/data
      # Replace these example mounts with your real media paths.
      - /mnt/media/downloads:/mnt/media/downloads
      - /mnt/media/library:/mnt/media/library
    env_file:
      - .env
    restart: unless-stopped
